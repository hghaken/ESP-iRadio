; ESP32 internet radio - Olimex ESP32-DevKit-LiPo (WROVER, 4 MB flash, PSRAM)
; Streams internet radio over WiFi and sends it to Bluetooth (A2DP) headphones.

[platformio]
; Short core dir: toolchains and frameworks contain paths that exceed the Windows
; 260-character limit when unpacked under C:\Users\<name>\.platformio.
core_dir = C:/pio
default_envs = radio

; Arduino core 2.0.17 (ESP-IDF 4.4). Arduino 3.x (pioarduino) was tried first but its
; baseline leaves only ~175 KB internal heap; Bluetooth (80 KB) + WiFi (55 KB) + the
; A2DP connection then run out of RAM. Library versions are the last ones that build
; on IDF 4.4.
[common]
platform = espressif32@6.12.0
board = esp32-devkitlipo
framework = arduino

; Two OTA app slots of 1984 KB (see partitions_ota.csv). The firmware must stay below
; that: no TLS (own IcyStream client instead of audio-tools' URLStream), log level 2.
board_build.partitions = partitions_ota.csv
board_build.f_cpu = 240000000L

monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash savings (measured 2026-10-09, see AGENTS.md "Flash budget"):
; -fno-exceptions -47 KB (no code uses try/catch; a failed new already aborts),
; no -mfix-esp32-psram-cache-issue -7.6 KB (only needed for rev 0/1 silicon; this
; board is rev 3.1), no -fstack-protector -6 KB. BLE Mesh: src/bt_mesh_stubs.c.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -fno-exceptions
build_unflags =
    -fexceptions
    -fstack-protector

; Reapplies scripts/patch_a2dp_reconnect.py onto the gitignored ESP32-A2DP copy.
extra_scripts = pre:scripts/patch_a2dp_reconnect.py

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.3
    https://github.com/pschatzmann/arduino-libhelix.git
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Default: upload over WiFi to the running radio (web update endpoint).
[env:radio]
extends = common
upload_protocol = custom
upload_command = curl --fail --silent --show-error -m 300 -F "firmware=@$SOURCE" http://radio.local/api/update

; EXPERIMENTAL (2026-10-09): Arduino 2.0.17 built as an ESP-IDF 4.4.7 component, so the
; SDK can be configured (sdkconfig.defaults: 32 KB TCP window, lwIP in PSRAM, no BLE Mesh).
; See docs/framework-build.md. ESP-IDF 4.4 cannot build in a path with a space, so build it
; with .\scripts\build_idf.ps1 (mirrors the project to C:\pio\iradio-idf and builds there).
; Upload is blocked on purpose until the build has been tested; use the radio env.
[env:idf]
extends = common
framework = arduino, espidf
; Sources come from src/CMakeLists.txt (build_src_filter does not work with ESP-IDF).
; Here build_flags reach every IDF component (asio needs exceptions), so exceptions and
; the stack protector are set in sdkconfig.defaults instead of with compiler flags.
; IDF compiles with -Werror=all; audio-tools has harmless warnings (class-memaccess,
; delete-non-virtual-dtor) that the Arduino-only build never turned into errors.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -Wno-error
build_unflags =
    -Werror=all
; SBC bitpool limit for the speaker (see the script); runs in addition to the common one.
extra_scripts =
    pre:scripts/patch_a2dp_reconnect.py
    pre:scripts/patch_idf_bitpool.py
upload_protocol = custom
upload_command = echo "env idf: upload disabled until reviewed (docs/framework-build.md)" && exit 1

; Serial upload (first install of the OTA partition table, or when OTA is broken).
[env:usb]
extends = common
upload_port = COM7
upload_speed = 921600
