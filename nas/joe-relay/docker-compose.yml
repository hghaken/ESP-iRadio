# Joe relay for ESP iRadio: Liquidsoap in Docker on the NAS (see README.md).
services:
  joe-relay:
    image: savonet/liquidsoap:v2.4.6
    container_name: joe-relay
    restart: unless-stopped
    # Icecast runs on the NAS itself; with host networking 127.0.0.1:8888 is that Icecast.
    network_mode: host
    entrypoint: ["liquidsoap"]
    command: ["/scripts/joe.liq"]
    environment:
      # Comes from the .env file next to this file (not in git).
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
    volumes:
      - ./joe.liq:/scripts/joe.liq:ro
